<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test VTN</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --accent: #0f766e; --danger: #b91c1c; --ok: #15803d;
    font-family: system-ui, sans-serif; font-size: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --panel: #292524; --text: #f5f5f4; --muted: #a8a29e;
      --line: #44403c; --accent: #2dd4bf; --danger: #f87171; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           justify-content: space-between; padding: 12px 16px;
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { height: 22px; width: auto; display: block; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line);
            border-radius: 6px; padding: 12px; margin-bottom: 16px; overflow-x: auto; }
  .muted { color: var(--muted); }
  .error { color: var(--danger); }
  .ok { color: var(--ok); }
  ul.vens { list-style: none; margin: 0; padding: 0; }
  ul.vens li { padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  ul.vens li.selected, ul.vens li:hover { background: var(--line); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line);
           vertical-align: top; white-space: nowrap; }
  td.wrap { white-space: normal; }
  input, select, button { font: inherit; color: inherit; background: var(--bg);
                          border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  form.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
              gap: 8px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  code { font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ecosuite" viewBox="0 0 264 38" fill="none"><path d="M71.8129 8.96701V13.1886H52.6789V17.5928H69.9976V21.723H52.6789V26.0359H71.8129V30.2879H48.1406V8.96701H71.8129Z" fill="currentColor"></path><path d="M98.8622 14.9125C97.5464 13.5601 95.7311 13.1885 93.3005 13.1885H85.1925C80.977 13.1885 78.6074 15.5887 78.6074 19.597V19.6275C78.6378 23.6906 81.0075 26.0664 85.1925 26.0664H93.3005C95.8164 26.0664 97.5708 25.6339 98.8622 24.312L101.555 27.7903C99.5628 29.7275 97.0774 30.4707 93.3066 30.4707H85.1986C78.1505 30.4707 74.0508 26.3771 74.0508 19.6275V19.597C74.0508 12.8839 78.1444 8.78424 85.1986 8.78424H93.3066C96.9616 8.78424 99.5384 9.46042 101.555 11.4646L98.8622 14.9125Z" fill="currentColor"></path><path d="M122.574 8.78424C129.622 8.78424 133.721 12.8779 133.721 19.597V19.6275C133.721 26.371 129.628 30.4707 122.574 30.4707H113.765C106.717 30.4707 102.617 26.3771 102.617 19.6275V19.597C102.617 12.8839 106.711 8.78424 113.765 8.78424H122.574ZM122.574 26.0603C126.935 26.0603 129.159 23.6297 129.159 19.6214V19.5909C129.159 15.6191 126.935 13.1824 122.574 13.1824H113.765C109.403 13.1824 107.18 15.613 107.18 19.5909V19.6214C107.18 23.6236 109.403 26.0603 113.765 26.0603H122.574Z" fill="currentColor"></path><path d="M157.515 15.1927C156.699 13.5906 155.377 12.9144 152.983 12.9144H143.736C141.628 12.9144 140.458 13.6211 140.458 14.9186C140.458 15.9968 141.159 16.7035 143.413 17.0141L155.115 17.8182C159.885 18.3726 161.377 21.1138 161.347 24.1962C161.347 27.833 158.892 30.4768 153.708 30.4768H144.259C139.551 30.4768 136.596 28.7833 135.512 25.7923L139.581 23.4226C140.373 25.6095 141.865 26.3771 144.29 26.3771H153.769C155.962 26.3771 157.046 25.6095 157.046 24.1597C157.046 22.7099 156.138 22.186 154.207 21.9119L142.213 20.9859C137.705 20.4316 136.157 17.9035 136.157 15.0404C136.157 11.3428 138.643 8.79034 143.967 8.79034H153.068C157.223 8.79034 159.915 10.2097 161.054 12.6403L157.515 15.1988V15.1 792ZM259.836 2.69253H260.427C260.53 2.69253 260.622 2.66207 260.695 2.60725C260.768 2.55242 260.804 2.46714 260.804 2.36358C260.804 2.26002 260.768 2.18083 260.695 2.126C260.622 2.07118 260.536 2.04681 260.427 2.04681H259.836V2.69253Z" fill="currentColor"></path><path d="M0 13.353C1.01731 13.1277 1.91888 12.5916 2.60725 11.8545L10.362 16.3319V22.1982L2.60725 26.6756C1.91888 25.9385 1.01731 25.4085 0 25.177L0 13.353Z" fill="#0075FF"></path><path d="M35.5338 25.177C34.5165 25.4024 33.615 25.9385 32.9266 26.6756L25.1719 22.1982V16.3319L32.9266 11.8545C33.615 12.5916 34.5165 13.1216 35.5338 13.353V25.177Z" fill="#0075FF"></path><path d="M31.7649 9.83811L24.0102 14.3155L18.9297 11.3854V2.4367C20.1115 2.15648 21.1288 1.47421 21.8354 0.529999L31.9111 6.51813C31.6796 7.09685 31.5517 7.72429 31.5517 8.38219C31.5517 8.8878 31.6248 9.36905 31.7649 9.83202V9.83811Z" fill="#0075FF"></path><path d="M16.6025 2.43668V11.3854L11.522 14.3155L3.76729 9.83809C3.90131 9.37512 3.9805 8.89388 3.9805 8.38827C3.9805 7.73036 3.85258 7.10292 3.62109 6.52421L13.6968 0.536072C14.4034 1.47419 15.4207 2.16255 16.6025 2.44277V2.43668Z" fill="#0075FF"></path><path d="M3.7712 28.6919L11.5259 24.2145L16.6064 27.1446V36.0933C15.4246 36.3735 14.4073 37.0558 13.7007 38L3.625 32.0118C3.85648 31.4331 3.98441 30.8057 3.98441 30.1478C3.98441 29.6422 3.90522 29.1548 3.7712 28.698V28.6919Z" fill="#0075FF"></path><path d="M18.9336 36.0933V27.1446L24.0141 24.2145L31.7688 28.6919C31.6348 29.1548 31.5556 29.6361 31.5556 30.1417C31.5556 30.7996 31.6835 31.427 31.915 32.0058L21.8393 37.9939C21.1327 37.0558 20.1154 36.3674 18.9336 36.0872V36.0933Z" fill="#0075FF"></path></svg>
    <h1>Test VTN <span id="vtn" class="muted"></span></h1>
  </div>
  <label class="check">Control token
    <input id="token" type="password" autocomplete="off" size="24">
  </label>
</header>
<main>
  <div>
    <section>
      <h2>VENs</h2>
      <ul class="vens" id="vens"></ul>
      <p class="muted" id="no-vens">No VEN has registered yet. Point a connection's VTN URL at
        <code id="ven-url"></code>.</p>
    </section>
  </div>
  <div id="detail" hidden>
    <section>
      <h2 id="ven-title"></h2>
      <p id="ven-status"></p>
      <div class="actions">
        <button id="reregister">Request re-registration</button>
        <button id="cancel-registration" class="danger">Cancel registration</button>
      </div>
    </section>
    <section>
      <h2 id="form-title">New event</h2>
      <form class="grid" id="event-form">
        <label>Starts in (seconds)<input name="start_in_seconds" type="number" min="0" value="60"></label>
        <label>Signal
          <select name="signal">
            <option value="SIMPLE|level">SIMPLE level</option>
            <option value="ELECTRICITY_PRICE|price">ELECTRICITY_PRICE price (per kWh)</option>
            <option value="LOAD_DISPATCH|setpoint">LOAD_DISPATCH setpoint (kW)</option>
          </select>
        </label>
        <label>Intervals (seconds:value, …)<input name="intervals" value="300:1"></label>
        <label>Randomize start by (seconds)<input name="start_after_seconds" type="number" min="0"></label>
        <label>Comment<input name="comment"></label>
        <label class="check"><input name="response_required" type="checkbox" checked> Response required</label>
        <label class="check"><input name="test_event" type="checkbox"> Test event</label>
        <div class="actions">
          <button class="primary" type="submit" id="submit">Send event</button>
          <button type="button" id="new-event" hidden>New event instead</button>
        </div>
      </form>
      <p id="form-error" class="error"></p>
    </section>
    <section>
      <h2>Events</h2>
      <table>
        <thead><tr><th>Event</th><th>Status</th><th>Mod</th><th>Start</th><th>Length</th>
          <th>Signals</th><th>VEN's answer</th><th></th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </section>
    <section>
      <h2>Reports</h2>
      <div id="reports"></div>
    </section>
    <section>
      <h2>Messages</h2>
      <table>
        <thead><tr><th>#</th><th>Time</th><th>From the VEN</th><th>Answer</th></tr></thead>
        <tbody id="messages"></tbody>
      </table>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g,
  (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const time = (iso) => iso ? new Date(iso).toLocaleTimeString() : "";
const stamp = (iso) => iso ? new Date(iso).toLocaleString() : "";

let selected = null;
let editing = null;

function storedToken() {
  try { return localStorage.getItem("test-vtn-token") || ""; } catch { return ""; }
}
$("token").value = storedToken();
$("token").addEventListener("change", () => {
  try { localStorage.setItem("test-vtn-token", $("token").value); } catch {}
  refresh();
});

async function api(method, path, body) {
  const headers = {"Content-Type": "application/json"};
  if ($("token").value) headers.Authorization = `Bearer ${$("token").value}`;
  const response = await fetch(`api${path}`, {method, headers,
    body: body === undefined ? undefined : JSON.stringify(body)});
  const text = await response.text();
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) throw new Error(data?.error || response.statusText);
  return data;
}

function parseIntervals(text) {
  return text.split(",").map((part) => {
    const [duration, value] = part.split(":").map((s) => Number(s.trim()));
    return {duration_seconds: duration, value};
  });
}

function formEvent() {
  const form = $("event-form").elements;
  const [name, type] = form.signal.value.split("|");
  const signal = {name, type, intervals: parseIntervals(form.intervals.value)};
  if (name === "ELECTRICITY_PRICE") {
    signal.measurement = {name: "currencyPerKWh", unit: "USD", scale: "none"};
  } else if (name === "LOAD_DISPATCH") {
    signal.measurement = {name: "powerReal", unit: "W", scale: "k"};
  }
  const event = {
    start_in_seconds: Number(form.start_in_seconds.value || 0),
    signals: [signal],
    response_required: form.response_required.checked,
    test_event: form.test_event.checked,
    comment: form.comment.value || null,
  };
  if (form.start_after_seconds.value) event.start_after_seconds = Number(form.start_after_seconds.value);
  return event;
}

function editEvent(event) {
  editing = event.event_id;
  const form = $("event-form").elements;
  const signal = event.signals[0];
  form.signal.value = `${signal.name}|${signal.type}`;
  form.intervals.value = signal.intervals.map((i) => `${i.duration_seconds}:${i.value}`).join(", ");
  form.start_in_seconds.value = Math.max(0, Math.round((new Date(event.start) - Date.now()) / 1000));
  form.start_after_seconds.value = event.start_after_seconds ?? "";
  form.comment.value = event.comment ?? "";
  form.response_required.checked = event.response_required;
  form.test_event.checked = event.test_event;
  $("form-title").textContent = `Modify ${event.event_id}`;
  $("submit").textContent = "Send modification";
  $("new-event").hidden = false;
}

function newEvent() {
  editing = null;
  $("form-title").textContent = "New event";
  $("submit").textContent = "Send event";
  $("new-event").hidden = true;
}
$("new-event").addEventListener("click", newEvent);

$("event-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("form-error").textContent = "";
  try {
    if (editing) {
      await api("PATCH", `/vens/${encodeURIComponent(selected)}/events/${encodeURIComponent(editing)}`, formEvent());
      newEvent();
    } else {
      await api("POST", `/vens/${encodeURIComponent(selected)}/events`, formEvent());
    }
    refresh();
  } catch (error) {
    $("form-error").textContent = error.message;
  }
});

$("reregister").addEventListener("click", () =>
  api("POST", `/vens/${encodeURIComponent(selected)}/registration/reregister`).then(refresh, alert));
$("cancel-registration").addEventListener("click", () => {
  if (confirm("Cancel this VEN's registration?")) {
    api("POST", `/vens/${encodeURIComponent(selected)}/registration/cancel`).then(refresh, alert);
  }
});

function renderVens(vens) {
  $("no-vens").hidden = vens.length > 0;
  $("vens").innerHTML = vens.map((v) => `
    <li data-ven="${esc(v.ven_id)}" class="${v.ven_id === selected ? "selected" : ""}">
      ${esc(v.ven_name)}<br>
      <span class="${v.registered ? "ok" : "muted"}">${v.registered ? "registered" : "not registered"}</span>
      <span class="muted">· seen ${esc(time(v.last_contact_at))}</span>
    </li>`).join("");
  for (const li of $("vens").children) {
    li.addEventListener("click", () => { selected = li.dataset.ven; newEvent(); refresh(); });
  }
}

function renderVen(ven) {
  $("ven-title").textContent = ven.ven_name === ven.ven_id ? ven.ven_name
    : `${ven.ven_name} (${ven.ven_id})`;
  $("ven-status").innerHTML = ven.registered
    ? `<span class="ok">Registered</span> as <code>${esc(ven.registration_id)}</code> since ${esc(stamp(ven.registered_at))}.`
    : `<span class="muted">Not registered.</span>`;
  $("ven-status").innerHTML += ven.queued_messages.length
    ? ` Waiting for its next poll: ${ven.queued_messages.map(esc).join(", ")}.` : "";

  $("events").innerHTML = ven.events.slice().reverse().map((e) => `
    <tr>
      <td><code>${esc(e.event_id)}</code>${e.test_event ? " <span class='muted'>test</span>" : ""}</td>
      <td>${esc(e.status)}</td>
      <td>${esc(e.modification_number)}</td>
      <td>${esc(stamp(e.start))}${e.start_after_seconds ? ` <span class="muted">+${e.start_after_seconds}s</span>` : ""}</td>
      <td>${esc(e.duration_seconds)}s</td>
      <td class="wrap">${e.signals.map((s) => `${esc(s.name)}: ${s.intervals.map((i) => `${i.duration_seconds}s=${i.value}`).join(", ")}`).join("<br>")}</td>
      <td>${e.responses.length ? e.responses.map((r) => `${esc(r.opt)} <span class="muted">mod ${esc(r.modification_number)} via ${esc(r.via)}${r.response_code && r.response_code !== 200 ? ` (${esc(r.response_code)} ${esc(r.response_description)})` : ""}</span>`).join("<br>") : `<span class="muted">${e.response_required ? "none yet" : "not required"}</span>`}</td>
      <td class="actions">${e.status === "cancelled" || e.status === "completed" ? "" : `
        <button data-edit="${esc(e.event_id)}">Modify</button>
        <button class="danger" data-cancel="${esc(e.event_id)}">Cancel</button>`}</td>
    </tr>`).join("") || `<tr><td colspan="8" class="muted">No events.</td></tr>`;
  for (const button of document.querySelectorAll("[data-edit]")) {
    button.addEventListener("click", () => editEvent(ven.events.find((e) => e.event_id === button.dataset.edit)));
  }
  for (const button of document.querySelectorAll("[data-cancel]")) {
    button.addEventListener("click", () =>
      api("POST", `/vens/${encodeURIComponent(selected)}/events/${encodeURIComponent(button.dataset.cancel)}/cancel`)
        .then(refresh, alert));
  }
}

function renderReports(reports) {
  const latest = {};
  for (const update of reports.updates) latest[update.report_name] = update;
  $("reports").innerHTML = reports.offered.length ? `<table>
    <thead><tr><th>Report</th><th>Points</th><th>Requested every</th><th>Latest</th><th>Value</th></tr></thead>
    <tbody>${reports.offered.map((r) => {
      const request = reports.requests.find((q) => q.report_specifier_id === r.report_specifier_id);
      const update = latest[r.report_name];
      const payload = update?.intervals[0]?.report_payload;
      const value = payload?.payload_resource_status
        ? `online ${payload.payload_resource_status.online}, override ${payload.payload_resource_status.manual_override}`
        : payload?.value;
      return `<tr><td>${esc(r.report_name)}</td><td>${r.r_ids.map(esc).join(", ")}</td>
        <td>${request ? `${esc(request.granularity_seconds)}s${request.created ? "" : " (not confirmed)"}` : "not requested"}</td>
        <td>${esc(time(update?.at))}</td><td>${esc(value ?? "")}</td></tr>`;
    }).join("")}</tbody></table>` : `<p class="muted">No reports offered.</p>`;
}

function renderMessages(messages) {
  $("messages").innerHTML = messages.slice(-50).reverse().map((m) => `
    <tr><td>${esc(m.seq)}</td><td>${esc(time(m.at))}</td>
      <td>${esc(m.type)}</td>
      <td>${esc(m.reply_type ?? "(empty)")}${m.reply_code && m.reply_code !== 200 ? ` <span class="error">${esc(m.reply_code)}</span>` : ""}</td></tr>`
  ).join("");
}

async function refresh() {
  try {
    const vtn = await api("GET", "/vtn");
    $("vtn").textContent = `${vtn.vtn_id} · polls every ${vtn.poll_interval_seconds}s`;
    $("ven-url").textContent = `${location.origin}/v/<ven name>`;
    const vens = await api("GET", "/vens");
    if (selected && !vens.some((v) => v.ven_id === selected)) selected = null;
    if (!selected && vens.length) selected = vens[0].ven_id;
    renderVens(vens);
    $("detail").hidden = !selected;
    if (selected) {
      const path = `/vens/${encodeURIComponent(selected)}`;
      const [ven, reports, messages] = await Promise.all(
        [api("GET", path), api("GET", `${path}/reports`), api("GET", `${path}/messages`)]);
      renderVen(ven);
      renderReports(reports);
      renderMessages(messages);
    }
  } catch (error) {
    $("vtn").innerHTML = `<span class="error">${esc(error.message)}</span>`;
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
