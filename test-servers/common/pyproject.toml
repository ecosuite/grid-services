[project]
name = "test-common"
version = "0.1.0"
description = "What the grid-services test servers and their end-to-end suites share"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
e2e = [
    "pytest>=8,<9",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "pynacl>=1.5,<2",
    "cryptography>=43",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
